name: Build easy-install ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

      - name: Package Cloudflare Pages upload
        run: |
          mkdir pages-upload
          cp dist/index.js pages-upload/_worker.js
          cp dist/index.js.map pages-upload/index.js.map
          cd pages-upload
          zip -9 ../discord-x-card-pages.zip _worker.js index.js.map

      - uses: actions/upload-artifact@v4
        with:
          name: discord-x-card-pages
          path: discord-x-card-pages.zip

      - name: Publish fixed download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view easy-install >/dev/null 2>&1; then
            gh release upload easy-install discord-x-card-pages.zip --clobber
          else
            gh release create easy-install discord-x-card-pages.zip \
              --title "かんたんインストール用ZIP" \
              --notes "Cloudflare PagesのDirect Uploadへ、そのままアップロードするファイルです。" \
              --latest=false
          fi
